name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Build binary
        run: go build -o gencert

      - name: Tag commit
        id: tag
        uses: mathieudutour/github-tag-action@v5.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: v1.0.0
          message: Release v1.0.0

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: Release ${{ steps.tag.outputs.tag }}
          body: |
            This is the first release of the gencert program.
          draft: false
          prerelease: false